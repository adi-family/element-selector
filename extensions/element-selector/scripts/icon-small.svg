<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The 16-pixel rendering of icon.svg. Same drawing with a smaller mark and a heavier copy
       glyph: at this size the proportions of the large icon blur into one blob. -->
  <defs>
    <mask id="back" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path fill="#000" d="M127.71 65.00 L178.81 94.50 L178.81 153.50 L127.71 183.00 L76.62 153.50 L76.62 94.50 Z"/>
      <path fill="#000" d="M100.00 17.00 L151.10 46.50 L151.10 105.50 L100.00 135.00 L48.90 105.50 L48.90 46.50 Z"/>
    </mask>
    <mask id="middle" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path fill="#000" d="M100.00 17.00 L151.10 46.50 L151.10 105.50 L100.00 135.00 L48.90 105.50 L48.90 46.50 Z"/>
    </mask>
  </defs>
  <rect width="200" height="200" rx="44" fill="#171717"/>
  <g transform="translate(78 74) scale(0.6) translate(-100 -100)" fill="#fff">
    <path fill-opacity="0.52" mask="url(#back)" d="M72.29 68.00 L120.78 96.00 L120.78 152.00 L72.29 180.00 L23.79 152.00 L23.79 96.00 Z"/>
    <path fill-opacity="0.74" mask="url(#middle)" d="M127.71 68.00 L176.21 96.00 L176.21 152.00 L127.71 180.00 L79.22 152.00 L79.22 96.00 Z"/>
    <path d="M100.00 20.00 L148.50 48.00 L148.50 104.00 L100.00 132.00 L51.50 104.00 L51.50 48.00 Z"/>
  </g>
  <!-- Copy: a sheet and its duplicate. Each is drawn twice, first wider in the tile's colour, so
       it stands clear of whatever is behind it. The duplicate is the blue the picker outlines with. -->
  <rect x="94" y="94" width="54" height="54" rx="12" fill="#171717" stroke="#171717" stroke-width="32"/>
  <rect x="94" y="94" width="54" height="54" rx="12" fill="none" stroke="#fff" stroke-width="16"/>
  <rect x="124" y="124" width="54" height="54" rx="12" fill="#171717" stroke="#171717" stroke-width="32"/>
  <rect x="124" y="124" width="54" height="54" rx="12" fill="#3b82f6" stroke="#3b82f6" stroke-width="16"/>
</svg>
